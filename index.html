<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zora AI Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#09090b',
                        foreground: '#fafafa',
                        card: '#18181b',
                        border: '#27272a',
                        primary: '#a855f7',
                        'primary-foreground': '#ffffff',
                        muted: '#71717a',
                        'muted-foreground': '#a1a1aa'
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .primary-gradient {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
        }
        .brand-glow {
            box-shadow: 0 0 30px -5px rgba(168, 85, 247, 0.4);
        }
    </style>
</head>
<body class="bg-background text-foreground min-h-screen flex flex-col font-sans antialiased selection:bg-primary selection:text-white">
    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [conversations, setConversations] = useState([
                { id: '1', title: 'گفتوگۆی نوێ' }
            ]);
            const [currentConvoId, setCurrentConvoId] = useState('1');
            const [messagesMap, setMessagesMap] = useState({
                '1': [
                    { id: 'm1', role: 'assistant', content: 'سڵاو! من Zora AI م. چۆن دەتوانم ئەمڕۆ یارمەتیت بدەم؟' }
                ]
            });
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const scrollRef = useRef(null);

            const messages = messagesMap[currentConvoId] || [];

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [messages, currentConvoId]);

            useEffect(() => {
                scrollRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, loading]);

            const handleSend = (e) => {
                e.preventDefault();
                if (!input.trim() || loading) return;

                const userText = input.trim();
                const userMsg = { id: Date.now().toString(), role: 'user', content: userText };

                const updatedMessages = [...messages, userMsg];
                setMessagesMap(prev => ({
                    ...prev,
                    [currentConvoId]: updatedMessages
                }));
                setInput('');
                setLoading(true);

                // گۆڕینی ناوی گفتوگۆکە بەپێی یەکەم پرسیار
                setConversations(prev => prev.map(c => {
                    if (c.id === currentConvoId && c.title === 'گفتوگۆی نوێ') {
                        return { ...c, title: userText.slice(0, 30) };
                    }
                    return c;
                }));

                // وەڵامدانەوەی خۆکارانە و ڕوون بە زمانی کوردی بەبێ پێویستی بە API Key
                setTimeout(() => {
                    let replyText = `سوپاس بۆ پرسیارەکەت سەبارەت بە "${userText}". من لێرەم بۆ هاوکاری کردن و بەجێگەیاندنی پێویستییەکانت.`;
                    
                    if (userText.includes('سڵاو') || userText.toLowerCase().includes('hi')) {
                        replyText = 'سڵاو! ڕۆژت باش، فەرموو چۆن دەتوانم یارمەتیت بدەم؟';
                    } else if (userText.includes('ناوی') || userText.toLowerCase().includes('who')) {
                        replyText = 'من Zora AI مە، یاریدەدەری زیرەکی تۆ.';
                    }

                    const aiMsg = { id: (Date.now() + 1).toString(), role: 'assistant', content: replyText };
                    
                    setMessagesMap(prev => ({
                        ...prev,
                        [currentConvoId]: [...(prev[currentConvoId] || []), aiMsg]
                    }));
                    setLoading(false);
                }, 800);
            };

            const createNewChat = () => {
                const newId = Date.now().toString();
                setConversations(prev => [{ id: newId, title: 'گفتوگۆی نوێ' }, ...prev]);
                setMessagesMap(prev => ({
                    ...prev,
                    [newId]: [{ id: 'init-' + newId, role: 'assistant', content: 'سڵاو! گفتوگۆیەکی نوێ دەستی پێکرد. چۆن یارمەتیت بدەم؟' }]
                }));
                setCurrentConvoId(newId);
            };

            return (
                <div className="flex h-screen w-full overflow-hidden">
                    {/* Sidebar */}
                    <aside className="w-72 border-r border-border bg-card/40 flex flex-col hidden md:flex">
                        <div className="p-4 border-b border-border flex items-center justify-between">
                            <div className="flex items-center gap-2 font-bold text-lg">
                                <div className="w-8 h-8 rounded-xl primary-gradient flex items-center justify-center text-white brand-glow">Z</div>
                                <span>Zora AI</span>
                            </div>
                        </div>
                        <div className="p-3">
                            <button 
                                onClick={createNewChat}
                                className="w-full py-2.5 px-4 rounded-xl primary-gradient text-white font-medium text-sm flex items-center justify-center gap-2 brand-glow transition cursor-pointer"
                            >
                                <i data-lucide="plus" className="w-4 h-4"></i>
                                گفتوگۆی نوێ
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto px-3 space-y-1">
                            {conversations.map(c => (
                                <button
                                    key={c.id}
                                    onClick={() => setCurrentConvoId(c.id)}
                                    className={`w-full text-left px-3 py-2.5 rounded-xl text-sm truncate flex items-center gap-2 transition cursor-pointer ${c.id === currentConvoId ? 'bg-primary/20 text-primary border border-primary/30 font-medium' : 'text-muted-foreground hover:bg-card hover:text-foreground'}`}
                                >
                                    <i data-lucide="message-square" className="w-4 h-4 shrink-0"></i>
                                    <span className="truncate">{c.title}</span>
                                </button>
                            ))}
                        </div>
                    </aside>

                    {/* Main Chat Area */}
                    <main className="flex-1 flex flex-col h-full bg-background">
                        {/* Header */}
                        <header className="h-14 border-b border-border px-6 flex items-center justify-between bg-background/80 backdrop-blur">
                            <span className="font-semibold text-sm">Zora AI Assistant</span>
                            <span className="text-xs text-muted-foreground border border-border px-2.5 py-1 rounded-full">Standalone Mode</span>
                        </header>

                        {/* Messages Container */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                            <div className="max-w-2xl mx-auto w-full space-y-6">
                                {messages.map(m => (
                                    <div key={m.id} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[85%] rounded-2xl px-4 py-3 text-sm leading-relaxed whitespace-pre-wrap ${m.role === 'user' ? 'primary-gradient text-white rounded-br-sm shadow-lg' : 'bg-card border border-border text-foreground rounded-bl-sm'}`}>
                                            {m.content}
                                        </div>
                                    </div>
                                ))}
                                {loading && (
                                    <div className="flex justify-start">
                                        <div className="bg-card border border-border rounded-2xl px-4 py-3 text-sm text-muted-foreground flex items-center gap-2">
                                            <span className="w-2 h-2 rounded-full bg-primary animate-bounce"></span>
                                            <span className="w-2 h-2 rounded-full bg-primary animate-bounce [animation-delay:-.2s]"></span>
                                            <span className="w-2 h-2 rounded-full bg-primary animate-bounce [animation-delay:-.4s]"></span>
                                        </div>
                                    </div>
                                )}
                                <div ref={scrollRef} />
                            </div>
                        </div>

                        {/* Input Footer */}
                        <div className="p-4 border-t border-border bg-background/80 backdrop-blur">
                            <form onSubmit={handleSend} className="max-w-2xl mx-auto w-full flex items-center gap-2 bg-card border border-border rounded-2xl px-4 py-2 focus-within:border-primary transition">
                                <input 
                                    type="text"
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    placeholder="پرسیارەکەت لێرە بنووسە..."
                                    className="flex-1 bg-transparent border-0 outline-none text-sm py-2 text-foreground placeholder:text-muted-foreground"
                                />
                                <button 
                                    type="submit" 
                                    disabled={!input.trim() || loading}
                                    className="w-9 h-9 rounded-xl primary-gradient text-white flex items-center justify-center disabled:opacity-40 transition brand-glow cursor-pointer"
                                >
                                    <i data-lucide="send" className="w-4 h-4"></i>
                                </button>
                            </form>
                            <p className="text-center text-[11px] text-muted-foreground mt-2">Zora AI — Clean & Independent Edition</p>
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
